<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상미고 학생 확인</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background-color: #F0F2F5;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
            word-break: keep-all;
        }
        .header-logo {
            width: 40px;
            height: 40px;
            background-color: #4f46e5;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 1.25rem;
        }
        .control-bar {
            background-color: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        @media (min-width: 768px) {
            .control-bar {
                flex-direction: row;
                padding: 1rem 2.5rem;
                gap: 1.5rem;
            }
        }
        .select-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            flex: 1;
        }
        .select-label {
            font-size: 9px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        select {
            appearance: none;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            padding: 0.8rem 1rem;
            font-weight: 600;
            font-size: 1rem;
            outline: none;
            width: 100%;
            transition: all 0.2s;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1.25em 1.25em;
        }
        select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        .student-display-card {
            background-color: white;
            padding: 1rem;
            border-radius: 32px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 320px;
        }
        .student-image-frame {
            width: 100%;
            aspect-ratio: 3 / 4;
            background-color: #f1f5f9;
            border-radius: 24px;
            overflow: hidden;
            border: 3px solid #f8fafc;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.05);
            position: relative;
        }
        .student-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, 20px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, 20px); }
        }
        .exit-tooltip-container {
            position: fixed;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            background-color: #1e293b;
            color: white;
            padding: 0.85rem 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 100;
            animation: fadeInOut 2.5s forwards;
            width: 90%;
            max-width: 320px;
            text-align: center;
        }
        .decorative-blob {
            position: absolute;
            width: 12rem;
            height: 12rem;
            background-color: #e0e7ff;
            border-radius: 9999px;
            filter: blur(60px);
            opacity: 0.4;
            z-index: -10;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-200 px-5 md:px-10 py-4 md:py-6 flex justify-between items-center shadow-sm sticky top-0 z-40">
        <div class="flex items-center gap-3 md:gap-4">
            <!-- Back Button Trigger for Tooltip -->
            <button id="backBtn" class="p-2 -ml-2 rounded-full active:bg-slate-100 transition-colors">
                <i data-lucide="chevron-left" class="w-6 h-6 text-slate-600"></i>
            </button>
            <div class="header-logo">상</div>
            <div>
                <h1 class="text-lg md:text-2xl font-black text-slate-900 tracking-tight leading-none uppercase">상미고 학생 확인</h1>
                <p class="text-[10px] md:text-sm text-slate-500 mt-0.5 md:mt-1 font-medium italic">Sangmi ID System</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
            <span class="text-[10px] font-bold text-green-600 hidden sm:block">ONLINE</span>
        </div>
    </header>

    <!-- Control Bar (Selection Menus) -->
    <nav class="control-bar shadow-sm">
        <div class="flex flex-row gap-2 w-full md:flex-1">
            <div class="select-group">
                <label class="select-label">학년</label>
                <select id="gradeSelect">
                    <option value="">선택</option>
                </select>
            </div>
            
            <div class="select-group">
                <label class="select-label">반</label>
                <select id="classSelect" disabled>
                    <option value="">선택</option>
                </select>
            </div>
        </div>

        <div class="flex flex-row gap-2 w-full md:flex-1 items-end">
            <div class="select-group">
                <label class="select-label">번호</label>
                <select id="numSelect" disabled>
                    <option value="">선택</option>
                </select>
            </div>
            
            <button id="searchBtn" class="bg-indigo-600 text-white rounded-xl px-6 py-3 font-bold active:bg-indigo-700 transition-colors shadow-lg shadow-indigo-100 min-w-[100px]">
                조회
            </button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 md:p-10 relative">
        <div id="studentCard" class="student-display-card invisible">
            <div class="student-image-frame">
                <img id="studentImg" src="" alt="Student Portrait" class="student-image" onerror="handleImageError(this)">
                <div id="imgLoader" class="absolute inset-0 flex items-center justify-center bg-slate-100 hidden">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
                </div>
                <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/20 to-transparent h-16 md:h-20"></div>
            </div>
            
            <div class="mt-6 md:mt-8 text-center px-2">
                <span id="studentInfoText" class="text-[10px] md:text-[12px] font-bold text-slate-400 tracking-[0.2em] uppercase mb-1 block">Student Identity</span>
                <h2 id="studentName" class="text-4xl md:text-6xl font-black text-slate-900 tracking-tighter">학생 이름</h2>
            </div>
        </div>

        <!-- Initial Placeholder View -->
        <div id="placeholderView" class="flex flex-col items-center justify-center text-slate-400 z-10 py-10">
            <div class="w-16 h-16 md:w-20 md:h-20 bg-white rounded-3xl shadow-sm flex items-center justify-center mb-4 md:mb-6">
                <i data-lucide="user-search" class="w-8 h-8 md:w-10 md:h-10 text-indigo-200"></i>
            </div>
            <h3 class="text-lg md:text-xl font-bold text-slate-600 mb-2">학생 조회</h3>
            <p class="text-xs md:text-sm text-center">선택 메뉴에서 학년, 반, 번호를<br>선택하고 조회 버튼을 누르세요.</p>
        </div>

        <!-- Decorative Background Elements -->
        <div class="decorative-blob top-10 right-0"></div>
        <div class="decorative-blob bottom-10 left-0" style="background-color: #dbeafe; width: 15rem; height: 15rem;"></div>
    </main>

    <!-- Exit Tooltip -->
    <div id="exitTooltip" class="exit-tooltip-container hidden">
        <p class="text-sm font-medium">어플을 종료하시려면 브라우저 창을 닫아주세요.</p>
    </div>

    <script>
        /**
         * 학생 데이터베이스
         */
        const studentFiles = [
            '10101구주안.jpg',
            '10102김철수.jpg',
            '10201이영희.jpg',
            '20101박지민.jpg',
            '30510정상미.jpg'
        ];

        const IMAGE_FOLDER = './students/'; 

        let students = [];

        function parseStudentData() {
            students = studentFiles.map(filenameStr => {
                const namePart = filenameStr.split('.')[0];
                const grade = namePart.substring(0, 1);
                const classNum = namePart.substring(1, 3);
                const studentNum = namePart.substring(3, 5);
                const name = namePart.substring(5);

                return {
                    grade,
                    classNum,
                    studentNum,
                    name,
                    filename: filenameStr 
                };
            });
        }

        const gradeSelect = document.getElementById('gradeSelect');
        const classSelect = document.getElementById('classSelect');
        const numSelect = document.getElementById('numSelect');
        const searchBtn = document.getElementById('searchBtn');
        const studentCard = document.getElementById('studentCard');
        const studentImg = document.getElementById('studentImg');
        const studentName = document.getElementById('studentName');
        const studentInfoText = document.getElementById('studentInfoText');
        const placeholderView = document.getElementById('placeholderView');
        const backBtn = document.getElementById('backBtn');
        const exitTooltip = document.getElementById('exitTooltip');

        function initSelects() {
            const grades = [...new Set(students.map(s => s.grade))].sort();
            
            gradeSelect.innerHTML = '<option value="">선택</option>' + 
                grades.map(g => `<option value="${g}">${g}학년</option>`).join('');
            
            gradeSelect.addEventListener('change', (e) => {
                const grade = e.target.value;
                updateClassOptions(grade);
                resetStudentView();
            });

            classSelect.addEventListener('change', (e) => {
                const grade = gradeSelect.value;
                const classNum = e.target.value;
                updateNumOptions(grade, classNum);
                resetStudentView();
            });

            numSelect.addEventListener('change', () => {
                resetStudentView();
            });

            searchBtn.addEventListener('click', () => {
                const grade = gradeSelect.value;
                const classNum = classSelect.value;
                const studentNum = numSelect.value;
                
                if (grade && classNum && studentNum) {
                    showStudent(grade, classNum, studentNum);
                } else {
                    alert('학년, 반, 번호를 모두 선택해주세요.');
                }
            });
        }

        function updateClassOptions(grade) {
            if (!grade) {
                classSelect.disabled = true;
                classSelect.innerHTML = '<option value="">선택</option>';
                numSelect.disabled = true;
                numSelect.innerHTML = '<option value="">선택</option>';
                return;
            }

            const classes = [...new Set(students.filter(s => s.grade === grade).map(s => s.classNum))].sort();
            classSelect.disabled = false;
            classSelect.innerHTML = '<option value="">선택</option>' + 
                classes.map(c => `<option value="${c}">${parseInt(c)}반</option> `).join('');
            
            numSelect.disabled = true;
            numSelect.innerHTML = '<option value="">선택</option>';
        }

        function updateNumOptions(grade, classNum) {
            if (!classNum) {
                numSelect.disabled = true;
                numSelect.innerHTML = '<option value="">선택</option>';
                return;
            }

            const nums = students
                .filter(s => s.grade === grade && s.classNum === classNum)
                .map(s => s.studentNum)
                .sort();

            numSelect.disabled = false;
            numSelect.innerHTML = '<option value="">선택</option>' + 
                nums.map(n => `<option value="${n}">${parseInt(n)}번</option>`).join('');
        }

        function handleImageError(img) {
            const currentSrc = img.src;
            if (currentSrc.toLowerCase().endsWith('.jpg') && !currentSrc.endsWith('.JPG')) {
                img.src = currentSrc.replace(/\.jpg$/i, '.JPG');
                return;
            }
            img.onerror = null;
            img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`
                <svg width="320" height="420" xmlns="http://www.w3.org/2000/svg">
                    <rect width="100%" height="100%" fill="#f1f5f9"/>
                    <text x="50%" y="50%" font-family="sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">
                        사진을 찾을 수 없음
                    </text>
                </svg>
            `)}`;
        }

        function showStudent(grade, classNum, studentNum) {
            if (!studentNum) return;

            const student = students.find(s => 
                s.grade === grade && 
                s.classNum === classNum && 
                s.studentNum === studentNum
            );

            if (student) {
                const numericId = student.grade + student.classNum + student.studentNum;
                const finalPath = './' + IMAGE_FOLDER + numericId + '.jpg';

                studentImg.removeAttribute('src');
                studentImg.onerror = () => handleImageError(studentImg);
                studentImg.src = finalPath;

                studentName.textContent = student.name;
                studentInfoText.textContent = `${parseInt(student.grade)}학년 ${parseInt(student.classNum)}반 ${parseInt(student.studentNum)}번 Student ID`;
                
                placeholderView.classList.add('hidden');
                studentCard.classList.remove('invisible');
            }
        }

        function resetStudentView() {
            studentCard.classList.add('invisible');
            placeholderView.classList.remove('hidden');
        }

        function showExitTooltip() {
            exitTooltip.classList.remove('hidden');
            setTimeout(() => {
                exitTooltip.classList.add('hidden');
            }, 2500);
        }

        backBtn.addEventListener('click', showExitTooltip);

        window.history.pushState(null, null, window.location.href);
        window.onpopstate = function() {
            showExitTooltip();
            window.history.pushState(null, null, window.location.href);
        };

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            parseStudentData();
            initSelects();
        });
    </script>
</body>
</html>
