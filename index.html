<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>상미고 학생 확인</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #f3f5fa;
            --surface: #ffffff;
            --ink: #0f172a;
            --muted: #4b5870;
            --line: #dde3ee;
            --accent: #4338ca;
            --accent-ink: #ffffff;
            --accent-soft: #eceefe;
            --photo-bg: #e6eaf3;
            --r: 12px;
            --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 12px rgba(15, 23, 42, .05);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d1120;
                --surface: #161b2f;
                --ink: #e9edf8;
                --muted: #a3aec8;
                --line: #272e49;
                --accent: #9aa0f7;
                --accent-ink: #0d1120;
                --accent-soft: #232a54;
                --photo-bg: #212840;
                --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 12px rgba(0, 0, 0, .3);
            }
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            min-height: 100dvh;
            font-family: 'Noto Sans KR', system-ui, sans-serif;
            background: var(--bg);
            color: var(--ink);
            font-size: 1rem;
            line-height: 1.5;
            word-break: keep-all;
            -webkit-tap-highlight-color: transparent;
            font-variant-numeric: tabular-nums;
        }

        ::selection { background: var(--accent); color: var(--accent-ink); }

        button, input { font: inherit; color: inherit; }

        button { cursor: pointer; }

        :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

        .wrap { max-width: 1280px; margin: 0 auto; padding: 0 1rem; }

        /* 머리말 */
        .top { padding: 1rem 0 .75rem; }

        .top .wrap { display: flex; flex-direction: column; gap: .75rem; }

        .brand { display: flex; align-items: center; gap: .75rem; }

        .logo {
            width: 40px; height: 40px; border-radius: var(--r);
            background: var(--accent); color: var(--accent-ink);
            display: grid; place-items: center; font-weight: 800; font-size: 1.25rem;
        }

        .brand h1 { margin: 0; font-size: 1.25rem; font-weight: 800; line-height: 1.2; }

        .search { position: relative; flex: 1; }

        .search svg {
            position: absolute; left: .85rem; top: 50%; translate: 0 -50%;
            width: 20px; height: 20px; color: var(--muted); pointer-events: none;
        }

        .search input {
            width: 100%; height: 48px; padding: 0 3rem 0 2.75rem;
            background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
            font-size: 1rem; font-weight: 500;
            transition: border-color .15s, box-shadow .15s;
        }

        .search input::-webkit-search-cancel-button { appearance: none; display: none; }

        .search input::placeholder { color: var(--muted); opacity: 1; }

        .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

        .search .clear {
            position: absolute; right: .35rem; top: 50%; translate: 0 -50%;
            width: 40px; height: 40px; border: 0; border-radius: var(--r);
            background: transparent; color: var(--muted); display: none; place-items: center;
        }

        .search .clear:hover { background: var(--accent-soft); }
        .search.has-text .clear { display: grid; }
        .search .clear svg { position: static; translate: none; width: 18px; height: 18px; }

        @media (min-width: 768px) {
            .wrap { padding: 0 2rem; }
            .top .wrap { flex-direction: row; align-items: center; justify-content: space-between; gap: 2rem; }
            .search { max-width: 420px; }
        }

        /* 학년·반 선택 (스크롤해도 위에 고정) */
        .filters {
            position: sticky; top: 0; z-index: 10;
            background: var(--bg); border-bottom: 1px solid var(--line);
            padding: .5rem 0;
        }

        .filters .wrap { display: flex; flex-direction: column; gap: .5rem; }

        .seg {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px;
            background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
        }

        .seg button {
            min-height: 44px; border: 0; border-radius: 8px; background: transparent;
            font-weight: 700; color: var(--muted);
            transition: background-color .15s, color .15s;
        }

        .seg button:hover { background: var(--accent-soft); color: var(--ink); }
        .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

        .chips {
            display: flex; gap: .5rem; overflow-x: auto; padding-bottom: 2px;
            scrollbar-width: thin; scrollbar-color: var(--line) transparent;
            scroll-snap-type: x proximity;
        }

        .chips button {
            flex: none; min-width: 56px; min-height: 44px; padding: 0 1rem;
            border: 1px solid var(--line); border-radius: var(--r); background: var(--surface);
            font-weight: 700; scroll-snap-align: center;
            transition: background-color .15s, border-color .15s;
        }

        .chips button:hover { border-color: var(--accent); }
        .chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

        @media (min-width: 768px) {
            .filters .wrap { flex-direction: row; align-items: center; gap: 1rem; }
            .seg { width: 280px; flex: none; }
        }

        /* 명렬표 */
        main { padding: 1rem 0 3rem; }

        .roster-head { display: flex; align-items: baseline; gap: .6rem; margin: .25rem 0 1rem; }
        .roster-head h2 { margin: 0; font-size: 1.375rem; font-weight: 800; }
        .roster-head span { color: var(--muted); font-weight: 500; }

        .grid {
            list-style: none; margin: 0; padding: 0;
            display: grid; gap: .75rem;
            grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        }

        @media (min-width: 768px) {
            .grid { gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
        }

        .card {
            width: 100%; padding: .5rem; text-align: left;
            background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
            box-shadow: var(--shadow); display: block;
            transition: border-color .15s, transform .15s;
        }

        .card:hover { border-color: var(--accent); }
        .card:active { transform: scale(.98); }

        .photo {
            aspect-ratio: 3 / 4; border-radius: 8px; overflow: hidden; background: var(--photo-bg);
            display: grid; place-items: center; position: relative;
        }

        .photo img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .2s; }
        .photo img.ready { opacity: 1; }

        .photo .initial { font-size: 2.5rem; font-weight: 800; color: var(--muted); }

        .card .name { display: block; margin-top: .5rem; font-weight: 800; font-size: 1.0625rem; line-height: 1.25; }
        .card .meta { display: block; font-size: .8125rem; color: var(--muted); font-weight: 500; }

        .empty { text-align: center; padding: 4rem 1rem; color: var(--muted); }
        .empty strong { display: block; color: var(--ink); font-size: 1.125rem; margin-bottom: .25rem; }

        /* 크게 보기 */
        dialog {
            width: min(92vw, 460px); max-height: 94dvh; padding: 0; border: 0; border-radius: var(--r);
            background: var(--surface); color: var(--ink); box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
            overflow: auto;
        }

        dialog::backdrop { background: rgba(8, 12, 28, .72); }

        .viewer { padding: .75rem; display: flex; flex-direction: column; gap: .75rem; }

        .viewer .photo { max-height: 66dvh; width: 100%; margin: 0 auto; }

        .viewer .who { text-align: center; }
        .viewer .who h3 { margin: 0; font-size: 2.25rem; font-weight: 800; line-height: 1.15; }
        .viewer .who p { margin: .15rem 0 0; color: var(--muted); font-weight: 500; }

        .viewer .bar { display: grid; grid-template-columns: 1fr auto 1fr; gap: .5rem; align-items: center; }

        .btn {
            min-height: 48px; padding: 0 1rem; border: 1px solid var(--line); border-radius: var(--r);
            background: var(--surface); font-weight: 700;
            display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
        }

        .btn:hover:not(:disabled, .close) { border-color: var(--accent); background: var(--accent-soft); }
        .btn.close:hover { filter: brightness(1.1); }
        .btn:disabled { opacity: .4; cursor: default; }
        .btn svg { width: 20px; height: 20px; }
        .btn.close { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

        .viewer .pos { color: var(--muted); font-weight: 500; font-size: .875rem; }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>

<body>

    <header class="top">
        <div class="wrap">
            <div class="brand">
                <div class="logo" aria-hidden="true">상</div>
                <h1>상미고 학생 확인</h1>
            </div>
            <div class="search" id="searchBox">
                <i data-lucide="search" aria-hidden="true"></i>
                <input type="search" id="nameSearchInput" placeholder="이름으로 찾기 (예: 구주안)"
                    aria-label="학생 이름 검색" autocomplete="off" enterkeyhint="search">
                <button type="button" class="clear" id="clearBtn" aria-label="검색어 지우기">
                    <i data-lucide="x" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </header>

    <nav class="filters" id="filters" aria-label="학년과 반 선택">
        <div class="wrap">
            <div class="seg" id="gradeSeg" role="group" aria-label="학년"></div>
            <div class="chips" id="classChips" role="group" aria-label="반"></div>
        </div>
    </nav>

    <main>
        <div class="wrap">
            <div class="roster-head">
                <h2 id="rosterTitle"></h2>
                <span id="rosterCount"></span>
            </div>
            <ul class="grid" id="grid"></ul>
            <div class="empty" id="empty" hidden>
                <strong>일치하는 학생이 없습니다</strong>
                이름의 일부만 입력해 보세요.
            </div>
        </div>
    </main>

    <dialog id="viewer" aria-label="학생 사진 크게 보기">
        <div class="viewer">
            <div class="photo" id="vPhoto"></div>
            <div class="who">
                <h3 id="vName"></h3>
                <p id="vMeta"></p>
            </div>
            <div class="bar">
                <button type="button" class="btn" id="prevBtn"><i data-lucide="chevron-left" aria-hidden="true"></i>이전</button>
                <span class="pos" id="vPos"></span>
                <button type="button" class="btn" id="nextBtn">다음<i data-lucide="chevron-right" aria-hidden="true"></i></button>
            </div>
            <button type="button" class="btn close" id="closeBtn">닫기</button>
        </div>
    </dialog>

        const IMAGE_FOLDER = './students/';

        const students = studentFiles.map(f => {
            const id = f.split('.')[0];
            return {
                id: id.slice(0, 5),
                grade: +id[0],
                cls: +id.slice(1, 3),
                num: +id.slice(3, 5),
                name: id.slice(5),
            };
        }).sort((a, b) => a.id.localeCompare(b.id));

        const $ = id => document.getElementById(id);
        const gradeSeg = $('gradeSeg'), classChips = $('classChips'), grid = $('grid');
        const searchInput = $('nameSearchInput'), searchBox = $('searchBox'), filters = $('filters');
        const viewer = $('viewer');

        const grades = [...new Set(students.map(s => s.grade))];
        const classesOf = g => [...new Set(students.filter(s => s.grade === g).map(s => s.cls))];

        const state = { grade: grades[0], cls: classesOf(grades[0])[0], query: '', list: [], index: -1 };

        // 마지막으로 본 학년·반 기억 (저장이 막힌 브라우저에서는 건너뜀)
        try {
            const saved = JSON.parse(localStorage.getItem('sangmi-roster') || 'null');
            if (saved && classesOf(saved.grade).includes(saved.cls)) { state.grade = saved.grade; state.cls = saved.cls; }
        } catch (e) { }

        function save() {
            try { localStorage.setItem('sangmi-roster', JSON.stringify({ grade: state.grade, cls: state.cls })); } catch (e) { }
        }

        function photoNode(s, eager) {
            const box = document.createElement('div');
            box.className = 'photo';
            const img = new Image();
            img.alt = `${s.name} 사진`;
            img.decoding = 'async';
            if (!eager) img.loading = 'lazy';
            img.onload = () => img.classList.add('ready');
            img.onerror = () => {
                img.remove();
                const t = document.createElement('span');
                t.className = 'initial';
                t.textContent = s.name[0];
                t.title = '사진이 없습니다';
                box.append(t);
            };
            img.src = IMAGE_FOLDER + s.id + '.jpg';
            box.append(img);
            return box;
        }

        function renderFilters() {
            gradeSeg.replaceChildren(...grades.map(g => {
                const b = document.createElement('button');
                b.type = 'button';
                b.textContent = `${g}학년`;
                b.setAttribute('aria-pressed', String(g === state.grade));
                b.onclick = () => { state.grade = g; state.cls = classesOf(g)[0]; clearSearch(false); save(); render(); };
                return b;
            }));
            classChips.replaceChildren(...classesOf(state.grade).map(c => {
                const b = document.createElement('button');
                b.type = 'button';
                b.textContent = `${c}반`;
                b.setAttribute('aria-pressed', String(c === state.cls));
                b.onclick = () => { state.cls = c; clearSearch(false); save(); render(); };
                return b;
            }));
            const on = classChips.querySelector('[aria-pressed="true"]');
            if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
        }

        function render() {
            const searching = state.query !== '';
            filters.hidden = searching;
            state.list = searching
                ? students.filter(s => s.name.includes(state.query))
                : students.filter(s => s.grade === state.grade && s.cls === state.cls);

            $('rosterTitle').textContent = searching ? `"${state.query}" 검색 결과` : `${state.grade}학년 ${state.cls}반`;
            $('rosterCount').textContent = `${state.list.length}명`;
            $('empty').hidden = state.list.length > 0;

            if (!searching) renderFilters();

            grid.replaceChildren(...state.list.map((s, i) => {
                const li = document.createElement('li');
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'card';
                b.setAttribute('aria-label', `${s.name}, ${s.grade}학년 ${s.cls}반 ${s.num}번, 크게 보기`);
                b.onclick = () => openViewer(i);
                const name = document.createElement('span');
                name.className = 'name';
                name.textContent = s.name;
                const meta = document.createElement('span');
                meta.className = 'meta';
                meta.textContent = searching ? `${s.grade}학년 ${s.cls}반 ${s.num}번` : `${s.num}번`;
                b.append(photoNode(s, i < 12), name, meta);
                li.append(b);
                return li;
            }));
        }

        function clearSearch(rerender = true) {
            state.query = '';
            searchInput.value = '';
            searchBox.classList.remove('has-text');
            if (rerender) render();
        }

        searchInput.addEventListener('input', () => {
            state.query = searchInput.value.trim();
            searchBox.classList.toggle('has-text', searchInput.value !== '');
            render();
        });

        // 결과가 한 명이면 Enter로 바로 크게 보기
        searchInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && state.list.length === 1) openViewer(0);
            if (e.key === 'Escape') clearSearch();
        });

        $('clearBtn').onclick = () => { clearSearch(); searchInput.focus(); };

        /* 크게 보기 */
        function showViewer() {
            const s = state.list[state.index];
            $('vPhoto').replaceWith(Object.assign(photoNode(s, true), { id: 'vPhoto' }));
            $('vName').textContent = s.name;
            $('vMeta').textContent = `${s.grade}학년 ${s.cls}반 ${s.num}번`;
            $('vPos').textContent = `${state.index + 1} / ${state.list.length}`;
            $('prevBtn').disabled = state.index === 0;
            $('nextBtn').disabled = state.index === state.list.length - 1;
            // 다음 사진 미리 받아 두기
            const nxt = state.list[state.index + 1];
            if (nxt) new Image().src = IMAGE_FOLDER + nxt.id + '.jpg';
        }

        function openViewer(i) {
            state.index = i;
            showViewer();
            if (!viewer.open) viewer.showModal();
        }

        function step(d) {
            const n = state.index + d;
            if (n >= 0 && n < state.list.length) { state.index = n; showViewer(); }
        }

        $('prevBtn').onclick = () => step(-1);
        $('nextBtn').onclick = () => step(1);
        $('closeBtn').onclick = () => viewer.close();
        viewer.addEventListener('click', e => { if (e.target === viewer) viewer.close(); });
        viewer.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') step(-1);
            if (e.key === 'ArrowRight') step(1);
        });

        // 브라우저 뒤로가기 방지 (기존 동작 유지)
        window.history.pushState(null, null, window.location.href);
        window.onpopstate = () => window.history.pushState(null, null, window.location.href);

        lucide.createIcons();
        render();
    </script>
