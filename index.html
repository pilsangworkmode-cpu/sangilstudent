<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상미고 학생 확인</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Inter & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background-color: #F0F2F5;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }
        .header-logo {
            width: 48px;
            height: 48px;
            background-color: #4f46e5;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 1.5rem;
        }
        .control-bar {
            background-color: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem 2.5rem;
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        .select-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            flex: 1;
        }
        .select-label {
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        select {
            appearance: none;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            font-weight: 600;
            outline: none;
            transition: all 0.2s;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1.25em 1.25em;
        }
        select:focus {
            ring: 2px solid #6366f1;
            border-color: #6366f1;
        }
        .student-display-card {
            background-color: white;
            padding: 1.5rem;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .student-image-frame {
            width: 320px;
            height: 420px;
            background-color: #f1f5f9;
            border-radius: 32px;
            overflow: hidden;
            border: 4px solid #f8fafc;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.05);
            position: relative;
        }
        .student-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(0.1);
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, 10px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, 10px); }
        }
        .exit-tooltip-container {
            position: fixed;
            bottom: 5rem;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ef4444;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            z-index: 50;
            animation: fadeInOut 2.5s forwards;
            min-width: 280px;
        }
        .decorative-blob {
            position: absolute;
            width: 16rem;
            height: 16rem;
            background-color: #e0e7ff;
            border-radius: 9999px;
            filter: blur(80px);
            opacity: 0.6;
            z-index: -10;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-hidden">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-200 px-10 py-6 flex justify-between items-center shadow-sm">

            </div>
        </div>
        <div class="hidden md:flex gap-3">
            <div class="bg-green-100 text-green-700 px-4 py-2 rounded-full text-xs font-bold flex items-center gap-2">

                시스템 정상 작동 중
            </div>
        </div>
    </header>

    <!-- Control Bar (Selection Menus) -->
    <nav class="control-bar flex flex-wrap md:flex-nowrap">
        <div class="select-group">

        </div>

        </div>

            <label class="select-label">Number / 번호</label>
            <select id="numSelect" disabled>
                <option value="">선택</option>
            </select>
        </div>

        <div class="flex flex-col gap-1 w-full md:w-32 mt-4 md:mt-0">
            <label class="select-label opacity-0">&nbsp;</label>
            <button class="bg-indigo-600 text-white rounded-lg px-4 py-3 font-bold hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-100">
                조회하기
            </button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 flex items-center justify-center p-6 md:p-10 relative">
        <div id="studentCard" class="student-display-card invisible">
            <div class="student-image-frame">
                <!-- onerror 로직을 개선하여 외부 placeholder 서비스 장애 시에도 대비 -->
                <img id="studentImg" src="" alt="Student Portrait" class="student-image" onerror="handleImageError(this)">
                <div id="imgLoader" class="absolute inset-0 flex items-center justify-center bg-slate-100 hidden">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
                </div>
                <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/20 to-transparent h-20"></div>
            </div>
            
            <div class="mt-8 text-center px-4">
                <span id="studentInfoText" class="text-[12px] font-bold text-slate-400 tracking-[0.3em] uppercase mb-1 block">Student Identity</span>
                <h2 id="studentName" class="text-5xl md:text-6xl font-black text-slate-900 tracking-tighter">학생 이름</h2>
            </div>
        </div>

        <!-- Initial Placeholder View -->
        <div id="placeholderView" class="flex flex-col items-center justify-center text-slate-400 z-10">
            <div class="w-20 h-20 bg-slate-200/50 rounded-full flex items-center justify-center mb-6">
                <i data-lucide="user-search" class="w-10 h-10 opacity-40"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-600 mb-2">상미고 학생 조회</h3>
            <p class="text-sm text-center">상단 메뉴에서 학년, 반, 번호를<br>선택하여 조회를 시작하세요.</p>
        </div>

        <!-- Decorative Background Elements -->
        <div class="decorative-blob top-10 right-10"></div>
        <div class="decorative-blob bottom-10 left-10" style="background-color: #dbeafe; width: 20rem; height: 20rem;"></div>
    </main>

    <!-- Footer / Status Bar -->
    <footer class="px-6 md:px-10 py-6 flex flex-col md:flex-row justify-between items-center bg-slate-900 text-white gap-4">
        <div class="flex items-center gap-4 text-slate-400 text-xs font-medium">
            <span id="filePathDisplay" class="truncate max-w-[200px] md:max-w-none">파일 경로: /images/students/...</span>
            <span class="w-1 h-1 bg-slate-600 rounded-full hidden md:block"></span>
            <span>시스템 상태: 정상</span>
        </div>
        
        <div class="relative">
            <button id="backBtn" class="flex items-center gap-2 bg-slate-800 px-6 py-2 rounded-full border border-slate-700 hover:bg-slate-700 transition-all text-sm">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                뒤로 가기
            </button>
        </div>
    </footer>

    <!-- Exit Tooltip -->

        <div class="text-[10px] font-bold uppercase mb-1 opacity-80 letter-spacing-widest">System Exit Notification</div>
        <p class="text-sm font-medium">어플을 종료하시려면 브라우저 창을 닫아주세요.</p>

        const IMAGE_FOLDER = './students/'; // 이미지 파일이 들어있는 폴더

        // 파싱된 데이터 저장
        let students = [];

        function parseStudentData() {
            students = studentFiles.map(filename => {
                // 확장자 제거
                const namePart = filename.split('.')[0];
                
                // 학년(1), 반(2), 번호(2), 이름(나머지)
                const grade = namePart.substring(0, 1);
                const classNum = namePart.substring(1, 3);
                const studentNum = namePart.substring(3, 5);
                const name = namePart.substring(5);

                return {
                    grade,
                    classNum,
                    studentNum,
                    name,
                    filename: IMAGE_FOLDER + filename
                };
            });
        }

        // DOM 요소
        const gradeSelect = document.getElementById('gradeSelect');
        const classSelect = document.getElementById('classSelect');
        const numSelect = document.getElementById('numSelect');
        const studentCard = document.getElementById('studentCard');
        const studentImg = document.getElementById('studentImg');
        const studentName = document.getElementById('studentName');
        const studentInfoText = document.getElementById('studentInfoText');
        const placeholderView = document.getElementById('placeholderView');
        const backBtn = document.getElementById('backBtn');
        const exitTooltip = document.getElementById('exitTooltip');
        const filePathDisplay = document.getElementById('filePathDisplay');

        // 선택 메뉴 초기화
        function initSelects() {
            const grades = [...new Set(students.map(s => s.grade))].sort();
            
            gradeSelect.innerHTML = '<option value="">선택</option>' + 
                grades.map(g => `<option value="${g}">${g}학년</option>`).join('');
            
            gradeSelect.addEventListener('change', (e) => {
                const grade = e.target.value;
                updateClassOptions(grade);
                resetStudentView();
            });

            classSelect.addEventListener('change', (e) => {
                const grade = gradeSelect.value;
                const classNum = e.target.value;
                updateNumOptions(grade, classNum);
                resetStudentView();
            });

            numSelect.addEventListener('change', (e) => {
                const grade = gradeSelect.value;
                const classNum = classSelect.value;
                const studentNum = e.target.value;
                showStudent(grade, classNum, studentNum);
            });
        }

        function updateClassOptions(grade) {
            if (!grade) {
                classSelect.disabled = true;
                classSelect.innerHTML = '<option value="">선택</option>';
                numSelect.disabled = true;
                numSelect.innerHTML = '<option value="">선택</option>';
                return;
            }

            const classes = [...new Set(students.filter(s => s.grade === grade).map(s => s.classNum))].sort();
            classSelect.disabled = false;
            classSelect.innerHTML = '<option value="">선택</option>' + 
                classes.map(c => `<option value="${c}">${parseInt(c)}반</option> `).join('');
            
            numSelect.disabled = true;
            numSelect.innerHTML = '<option value="">선택</option>';
        }

        function updateNumOptions(grade, classNum) {
            if (!classNum) {
                numSelect.disabled = true;
                numSelect.innerHTML = '<option value="">선택</option>';
                return;
            }

            const nums = students
                .filter(s => s.grade === grade && s.classNum === classNum)
                .map(s => s.studentNum)
                .sort();

            numSelect.disabled = false;
            numSelect.innerHTML = '<option value="">선택</option>' + 
                nums.map(n => `<option value="${n}">${parseInt(n)}번</option>`).join('');
        }

        // 이미지 로딩 실패 시 처리 (외부 서비스 의존성 제거)
        function handleImageError(img) {
            // 무한 루프 방지
            img.onerror = null;
            // 로컬 브라우저에서 생성 가능한 SVG 플레이스홀더 (네트워크 연결 필요 없음)
            img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`
                <svg width="320" height="420" xmlns="http://www.w3.org/2000/svg">
                    <rect width="100%" height="100%" fill="#f1f5f9"/>
                    <text x="50%" y="50%" font-family="sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">
                        사진 없음
                    </text>
                </svg>
            `)}`;
        }

        /* index.html 내의 showStudent 함수 부분을 아래와 같이 수정했습니다. */
function showStudent(grade, classNum, studentNum) {
    if (!studentNum) return;

    const student = students.find(s => 
        s.grade === grade && 
        s.classNum === classNum && 
        s.studentNum === studentNum
    );

    if (student) {
        // 1. 파일명만 추출해서 인코딩 (이미지 폴더명은 인코딩하지 않음)
        const encodedFilename = encodeURIComponent(student.filename);
        
        // 2. 최종 경로 생성 (상대 경로 ./ 를 붙여 더 명확하게 지정)
        const finalPath = './' + IMAGE_FOLDER + encodedFilename;

        // 콘솔에 출력되는 이 주소를 클릭해서 이미지가 실제로 열리는지 확인할 수 있습니다.
        console.log("확인 중인 이미지 전체 경로:", window.location.origin + '/' + IMAGE_FOLDER + encodedFilename);
        
        studentImg.src = finalPath;
        studentName.textContent = student.name;
        studentInfoText.textContent = `${parseInt(student.grade)}학년 ${parseInt(student.classNum)}반 ${parseInt(student.studentNum)}번`;
        filePathDisplay.textContent = `파일 경로: ${IMAGE_FOLDER}${student.filename}`;
        
        placeholderView.classList.add('hidden');
        studentCard.classList.remove('invisible');
    }
}

        function resetStudentView() {
            studentCard.classList.add('invisible');
            placeholderView.classList.remove('hidden');
        }

        // 뒤로가기 버튼 로직
        function showExitTooltip() {
            exitTooltip.classList.remove('hidden');
            setTimeout(() => {
                exitTooltip.classList.add('hidden');
            }, 2500);
        }

        backBtn.addEventListener('click', showExitTooltip);

        // 브라우저 뒤로가기 감지 (pushState 트릭)
        window.history.pushState(null, null, window.location.href);
        window.onpopstate = function() {
            showExitTooltip();
            window.history.pushState(null, null, window.location.href);
        };

        // 초기 구동
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            parseStudentData();
            initSelects();
        });
    </script>
</body>
</html>
